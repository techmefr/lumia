server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml;

	# Same-origin API. The app is opened from a phone or a tablet by the machine's LAN
	# address, so a backend host baked into the bundle would break the moment that address
	# changes. Proxying keeps one single origin and removes CORS from the picture.
	location /api/ {
		proxy_pass http://lumia-backend-api:8000/;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		# OPML exports run large.
		client_max_body_size 20m;
	}

	# Hashed filenames, so they can never go stale.
	location /_app/immutable/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		try_files $uri =404;
	}

	# SPA fallback: every route is resolved client-side.
	location / {
		try_files $uri $uri/ /index.html;
	}
}
