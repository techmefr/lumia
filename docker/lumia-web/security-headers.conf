# Included rather than set once at server level: nginx only inherits add_header into a location
# that declares none of its own, and the immutable-assets location sets its own Cache-Control.

# The directives that need no knowledge of the bundle. Everything about scripts and styles is
# emitted by the build itself, as a meta tag carrying the hashes of the inline code SvelteKit
# generates — a header written here could not know those hashes and would block its own app.
# frame-ancestors is the reverse case: a meta policy cannot carry it, so it belongs here.
add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

# Article content comes from third-party feeds and is rendered through {@html}. DOMPurify is the
# barrier; these are the net under it.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# The reader is never asked for any of these, so nothing in the page has a reason to ask either.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
