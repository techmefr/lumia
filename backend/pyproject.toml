[project]
name = "lumia-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "asyncpg>=0.32.0",
    "alembic>=1.20.1",
    "arq>=0.26",
    "pydantic-settings>=2.16.1",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "pyotp>=2.9",
    "httpx>=0.27",
    "aiosmtplib>=5.1.3",
    "cryptography>=50.0.2",
    "email-validator>=2.2",
    "scikit-learn>=1.9.1",
    "nltk>=3.10.4",
    "python-multipart>=0.0.32",
    "trafilatura>=2.3.1",
    "defusedxml>=0.7",
    "langdetect>=1.0.9",
    "lxml>=5.0",
    "nh3>=0.3.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=6.0",
    "ruff>=0.17.2",
    "mypy>=2.4.0",
    "pip-audit>=2.7",
    "types-defusedxml>=0.7",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["B008"]  # FastAPI's Depends() idiom is a function call in an argument default by design

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "nltk.*", "trafilatura.*", "langdetect.*", "lxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Coverage is on by default rather than behind a flag: a threshold nobody runs locally is a
# threshold that only ever fails in CI, on someone else's push.
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["api", "worker", "config"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_also = [
    # Bodies that exist for the type checker, never executed.
    "if TYPE_CHECKING:",
    "@overload",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "worker", "config"]
