# Images are pinned to a patch tag rather than a digest: a digest cannot be checked by hand
# on review, and Dependabot bumps the tag anyway. A floating tag was the real problem — two
# installs a fortnight apart did not run the same Miniflux.
services:
  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumia -d lumia"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: lumia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lumia
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  miniflux-postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: miniflux
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: miniflux
    volumes:
      - miniflux-postgres-data:/var/lib/postgresql/data
    networks:
      - internal

  miniflux:
    image: miniflux/miniflux:2.3.3
    restart: unless-stopped
    depends_on:
      - miniflux-postgres
    environment:
      # Its own database — never the lumia-backend one: Miniflux's own schema
      # (categories, feeds, users, ...) collides table-for-table with ours.
      DATABASE_URL: postgres://miniflux:${POSTGRES_PASSWORD}@miniflux-postgres/miniflux?sslmode=disable
      RUN_MIGRATIONS: 1
      WEBHOOK_URL: http://lumia-backend-api:8000/webhooks/miniflux
      WEBHOOK_SECRET: ${MINIFLUX_WEBHOOK_SECRET}
      ADMIN_USERNAME: ${MINIFLUX_USERNAME}
      ADMIN_PASSWORD: ${MINIFLUX_PASSWORD}
      CREATE_ADMIN: 1
    ports:
      - "8090:8080"
    networks:
      - internal

  lumia-backend-api:
    build:
      context: .
      dockerfile: docker/lumia-backend/Dockerfile
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    # Conditioned rather than ordered: without this the API starts while postgres is still
    # initialising, fails its first connections and needs a restart nobody asked for.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      miniflux:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      DATABASE_URL: postgresql+asyncpg://lumia:${POSTGRES_PASSWORD}@postgres/lumia
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY}
      # Empty by default: without them the instance waits for the browser onboarding screen.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MAX_ACCOUNTS: ${MAX_ACCOUNTS:-10}
      ACCOUNT_QUOTA_MB: ${ACCOUNT_QUOTA_MB:-1000}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      MINIFLUX_BASE_URL: http://miniflux:8080
      MINIFLUX_USERNAME: ${MINIFLUX_USERNAME}
      MINIFLUX_PASSWORD: ${MINIFLUX_PASSWORD}
      MINIFLUX_WEBHOOK_SECRET: ${MINIFLUX_WEBHOOK_SECRET}
      DEEPL_API_KEY: ${DEEPL_API_KEY}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174,http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    ports:
      - "8000:8000"
    networks:
      - internal
      - public

  lumia-backend-worker:
    build:
      context: .
      dockerfile: docker/lumia-backend/Dockerfile
    command: arq worker.technical.queue.WorkerSettings
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "arq", "--check", "worker.technical.queue.WorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    environment:
      DATABASE_URL: postgresql+asyncpg://lumia:${POSTGRES_PASSWORD}@postgres/lumia
      REDIS_URL: redis://redis:6379
      DEEPL_API_KEY: ${DEEPL_API_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    networks:
      - internal

  lumia-web:
    build:
      context: .
      dockerfile: docker/lumia-web/Dockerfile
    restart: unless-stopped
    depends_on:
      lumia-backend-api:
        condition: service_healthy
    ports:
      - "8080:80"
    networks:
      - public

  # The backend gate (ruff, mypy, pytest), run on demand:
  #   docker compose run --rm lumia-backend-tests
  # Its own env vars are deliberately minimal: tests/conftest.py fills the rest in with test values,
  # and anything set here would override them and make a test assert against the real config.
  lumia-backend-tests:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: docker/lumia-backend/Dockerfile
      target: dev
    command: pytest -q
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql+asyncpg://lumia:${POSTGRES_PASSWORD}@postgres/lumia_test
      # Database 1, so a test run never touches the queue the real worker is consuming.
      REDIS_URL: redis://redis:6379/1
    networks:
      - internal

networks:
  internal:
  public:

volumes:
  postgres-data:
  miniflux-postgres-data:
