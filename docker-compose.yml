services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lumia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lumia
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - internal

  miniflux:
    image: miniflux/miniflux:latest
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://lumia:${POSTGRES_PASSWORD}@postgres/lumia?sslmode=disable
      RUN_MIGRATIONS: 1
      WEBHOOK_URL: http://lumia-backend-worker:8001/webhooks/miniflux
    networks:
      - internal

  lumia-backend-api:
    build: ./docker/lumia-backend
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgres://lumia:${POSTGRES_PASSWORD}@postgres/lumia
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET}
    ports:
      - "8000:8000"
    networks:
      - internal
      - public

  lumia-backend-worker:
    build: ./docker/lumia-backend
    command: arq worker.queue.WorkerSettings
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgres://lumia:${POSTGRES_PASSWORD}@postgres/lumia
      REDIS_URL: redis://redis:6379
    networks:
      - internal

  lumia-web:
    build: ./docker/lumia-web
    restart: unless-stopped
    depends_on:
      - lumia-backend-api
    ports:
      - "8080:80"
    networks:
      - public

networks:
  internal:
  public:

volumes:
  postgres-data:
