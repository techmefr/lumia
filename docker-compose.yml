# Images are pinned to a patch tag rather than a digest: a digest cannot be checked by hand
# on review, and Dependabot bumps the tag anyway. A floating tag was the real problem — two
# installs a fortnight apart did not run the same Miniflux.
services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumia -d lumia"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: lumia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lumia
    volumes:
      # Mounted at /var/lib/postgresql, not .../data: since 18 the image keeps its data in a
      # major-version subdirectory and refuses to start against the older mount point.
      - postgres-data:/var/lib/postgresql
    networks:
      - internal

  redis:
    image: redis:8.10.1-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  miniflux-postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: miniflux
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: miniflux
    volumes:
      - miniflux-postgres-data:/var/lib/postgresql
    networks:
      - internal

  miniflux:
    image: miniflux/miniflux:2.3.3
    restart: unless-stopped
    depends_on:
      - miniflux-postgres
    environment:
      # Its own database — never the lumia-backend one: Miniflux's own schema
      # (categories, feeds, users, ...) collides table-for-table with ours.
      DATABASE_URL: postgres://miniflux:${POSTGRES_PASSWORD}@miniflux-postgres/miniflux?sslmode=disable
      RUN_MIGRATIONS: 1
      WEBHOOK_URL: http://lumia-backend-api:8000/webhooks/miniflux
      WEBHOOK_SECRET: ${MINIFLUX_WEBHOOK_SECRET}
      # lumia-backend-api resolves to a compose-internal address, and Miniflux refuses to call
      # a private IP from an integration unless told to. Without this every webhook is dropped
      # before it leaves Miniflux and no article ever reaches the reader.
      INTEGRATION_ALLOW_PRIVATE_NETWORKS: 1
      ADMIN_USERNAME: ${MINIFLUX_USERNAME}
      ADMIN_PASSWORD: ${MINIFLUX_PASSWORD}
      CREATE_ADMIN: 1
    ports:
      - "8090:8080"
    networks:
      - internal

  lumia-backend-api:
    build:
      context: .
      dockerfile: docker/lumia-backend/Dockerfile
    # No command: serving the API is the image's default. The worker below is the one that
    # overrides it.
    restart: unless-stopped
    # Conditioned rather than ordered: without this the API starts while postgres is still
    # initialising, fails its first connections and needs a restart nobody asked for.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      miniflux:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      DATABASE_URL: postgresql+asyncpg://lumia:${POSTGRES_PASSWORD}@postgres/lumia
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY}
      # Empty by default: without them the instance waits for the browser onboarding screen.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MAX_ACCOUNTS: ${MAX_ACCOUNTS:-10}
      ACCOUNT_QUOTA_MB: ${ACCOUNT_QUOTA_MB:-1000}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      MINIFLUX_BASE_URL: http://miniflux:8080
      MINIFLUX_USERNAME: ${MINIFLUX_USERNAME}
      MINIFLUX_PASSWORD: ${MINIFLUX_PASSWORD}
      MINIFLUX_WEBHOOK_SECRET: ${MINIFLUX_WEBHOOK_SECRET}
      DEEPL_API_KEY: ${DEEPL_API_KEY}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174,http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    ports:
      - "8000:8000"
    networks:
      - internal
      - public

  lumia-backend-worker:
    build:
      context: .
      dockerfile: docker/lumia-backend/Dockerfile
    command: arq worker.technical.queue.WorkerSettings
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "arq", "--check", "worker.technical.queue.WorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    environment:
      DATABASE_URL: postgresql+asyncpg://lumia:${POSTGRES_PASSWORD}@postgres/lumia
      REDIS_URL: redis://redis:6379
      # enrich_article reads the account's own provider key through decrypt_secret, so the worker
      # needs the same Fernet key as the API. Without it every enrichment job dies on startup.
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY}
      # The sync_feed_error_status cron calls Miniflux from the worker, so it needs the same
      # credentials as the API. Without them the cron raises on every run.
      MINIFLUX_BASE_URL: http://miniflux:8080
      MINIFLUX_USERNAME: ${MINIFLUX_USERNAME}
      MINIFLUX_PASSWORD: ${MINIFLUX_PASSWORD}
      MINIFLUX_WEBHOOK_SECRET: ${MINIFLUX_WEBHOOK_SECRET}
      DEEPL_API_KEY: ${DEEPL_API_KEY}
      # The digest cron mails readers from the worker, so it needs the same SMTP credentials as
      # the API, and the public address the articles link back to.
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    networks:
      - internal

  lumia-web:
    build:
      context: .
      dockerfile: docker/lumia-web/Dockerfile
    restart: unless-stopped
    depends_on:
      lumia-backend-api:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - public

  # The backend gate (ruff, mypy, pytest), run on demand:
  #   docker compose run --rm lumia-backend-tests sh -c 'ruff check . && mypy . && pytest -q'
  # Its own env vars are deliberately minimal: tests/conftest.py fills the rest in with test values,
  # and anything set here would override them and make a test assert against the real config.
  lumia-backend-tests:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: docker/lumia-backend/Dockerfile
      target: dev
    command: pytest -q
    depends_on:
      - postgres
      - redis
    # The source is mounted rather than left baked into the image. Without this the service runs
    # whatever was copied in at build time: the first run builds the image, and every run after it
    # silently tests the tree as it was then. A gate that goes green against code you already
    # changed is worse than no gate. The anonymous volume keeps the image's own .venv, which the
    # host has no copy of.
    volumes:
      - ./backend:/app
      - /app/.venv
    environment:
      DATABASE_URL: postgresql+asyncpg://lumia:${POSTGRES_PASSWORD}@postgres/lumia_test
      # Database 1, so a test run never touches the queue the real worker is consuming.
      REDIS_URL: redis://redis:6379/1
    networks:
      - internal

networks:
  internal:
  public:

volumes:
  postgres-data:
  miniflux-postgres-data:
