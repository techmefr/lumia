services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lumia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lumia
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - internal

  miniflux:
    image: miniflux/miniflux:latest
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://lumia:${POSTGRES_PASSWORD}@postgres/lumia?sslmode=disable
      RUN_MIGRATIONS: 1
      WEBHOOK_URL: http://lumia-backend-api:8000/webhooks/miniflux
      ADMIN_USERNAME: ${MINIFLUX_USERNAME}
      ADMIN_PASSWORD: ${MINIFLUX_PASSWORD}
      CREATE_ADMIN: 1
    networks:
      - internal

  lumia-backend-api:
    build:
      context: .
      dockerfile: docker/lumia-backend/Dockerfile
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - miniflux
    environment:
      DATABASE_URL: postgresql+asyncpg://lumia:${POSTGRES_PASSWORD}@postgres/lumia
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS}
      MINIFLUX_BASE_URL: http://miniflux
      MINIFLUX_USERNAME: ${MINIFLUX_USERNAME}
      MINIFLUX_PASSWORD: ${MINIFLUX_PASSWORD}
      DEEPL_API_KEY: ${DEEPL_API_KEY}
    ports:
      - "8000:8000"
    networks:
      - internal
      - public

  lumia-backend-worker:
    build:
      context: .
      dockerfile: docker/lumia-backend/Dockerfile
    command: arq worker.technical.queue.WorkerSettings
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql+asyncpg://lumia:${POSTGRES_PASSWORD}@postgres/lumia
      REDIS_URL: redis://redis:6379
      DEEPL_API_KEY: ${DEEPL_API_KEY}
    networks:
      - internal

  lumia-web:
    build: ./docker/lumia-web
    restart: unless-stopped
    depends_on:
      - lumia-backend-api
    ports:
      - "8080:80"
    networks:
      - public

networks:
  internal:
  public:

volumes:
  postgres-data:
