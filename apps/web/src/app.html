<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<!-- viewport-fit=cover so the safe-area insets the layout uses are non-zero on a notched phone. -->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<title>Lumia</title>
		<meta name="theme-color" content="#0b0b0f" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="apple-mobile-web-app-title" content="Lumia" />
		<meta name="mobile-web-app-capable" content="yes" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<!-- Self-hosted faces for the four selectable pairs. Kept out of app.css so the src urls
		     stay relative to this stylesheet and survive a sub-path deployment; the browser only
		     downloads the faces the active pair actually uses. -->
		<link rel="stylesheet" href="%sveltekit.assets%/fonts/fonts.css" />
		<script>
			(function () {
				try {
					var storedTheme = localStorage.getItem('lumia-theme');
					var theme =
						storedTheme ??
						(window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
					if (theme === 'dark') document.documentElement.classList.add('dark');

					var accents = {
						violet: 265,
						indigo: 290,
						bleu: 220,
						cyan: 200,
						sarcelle: 175,
						vert: 145,
						ambre: 50,
						terracotta: 25,
						rose: 340
					};
					var hue = accents[localStorage.getItem('lumia-accent')] ?? accents.violet;
					var lightness = theme === 'dark' ? 0.65 : 0.55;
					var accentLightness = theme === 'dark' ? 0.3 : 0.94;
					var accentChroma = theme === 'dark' ? 0.05 : 0.03;
					var root = document.documentElement.style;
					root.setProperty('--primary', 'oklch(' + lightness + ' 0.2 ' + hue + ')');
					root.setProperty('--ring', 'oklch(' + lightness + ' 0.2 ' + hue + ')');
					root.setProperty(
						'--accent',
						'oklch(' + accentLightness + ' ' + accentChroma + ' ' + hue + ')'
					);

					var scales = { sm: 0.9, md: 1, lg: 1.15, xl: 1.3, xxl: 1.5 };
					var scale = scales[localStorage.getItem('lumia-font-scale')] ?? 1;
					document.documentElement.style.fontSize = 16 * scale + 'px';

					var pairs = ['editorial', 'magazine', 'humaniste', 'technique'];
					var pair = localStorage.getItem('lumia-font-pair');
					document.documentElement.dataset.fontPair =
						pairs.indexOf(pair) === -1 ? pairs[0] : pair;

					if (localStorage.getItem('lumia-reading-comfort') === 'on') {
						document.documentElement.dataset.readingComfort = 'on';
					}
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
