<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<!-- viewport-fit=cover so the safe-area insets the layout uses are non-zero on a notched phone. -->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<title>Lumia</title>
		<meta name="theme-color" content="#0b0b0f" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="apple-mobile-web-app-title" content="Lumia" />
		<meta name="mobile-web-app-capable" content="yes" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<!-- Self-hosted faces for the four selectable pairs. Kept out of app.css so the src urls
		     stay relative to this stylesheet and survive a sub-path deployment; the browser only
		     downloads the faces the active pair actually uses. -->
		<link rel="stylesheet" href="%sveltekit.assets%/fonts/fonts.css" />
		<script src="%sveltekit.assets%/theme-boot.js"></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
